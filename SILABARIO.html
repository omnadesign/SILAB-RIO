<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silabário — hifenizador ES/EN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#4A3FB0; --grid:rgba(255,255,255,.13);
  --card:#fff; --ink:#1B1740; --soft:#6B66A0;
  --gold:#FFC83D; --green:#2FCB7A; --green-ink:#119257; --violet:#6A4DF0;
  --perf:#CFCAF0;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  display:flex; justify-content:center; padding:36px 16px 48px;
}
.page{width:100%; max-width:640px}
h1.title{
  font-family:'Fredoka',sans-serif; font-weight:700; font-size:3.4rem; line-height:1; margin:0 0 10px;
  color:var(--green); -webkit-text-stroke:7px #fff; paint-order:stroke fill;
  text-shadow:0 4px 0 rgba(27,23,64,.35); letter-spacing:.01em;
}
.tagline{font-family:'IBM Plex Mono',monospace; font-size:.82rem; color:#E4E0FF; margin:0 0 22px}

.tabs{display:flex; gap:10px; margin-bottom:18px}
.tab{
  flex:1; font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.05rem; padding:10px 8px;
  border:2px dashed rgba(255,255,255,.7); background:transparent; color:#fff; border-radius:10px; cursor:pointer;
  transition:transform .12s ease;
}
.tab:hover{transform:translateY(-1px)}
.tab.active{background:var(--gold); color:var(--ink); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); transform:rotate(-1deg)}

.ticket{background:var(--card); border-radius:14px; box-shadow:0 6px 0 rgba(27,23,64,.35); overflow:visible}
.top{padding:20px 22px 16px}
.stub{padding:18px 22px 20px}
.perf{position:relative; border-top:2px dashed var(--perf); margin:0}
.perf::before,.perf::after{content:""; position:absolute; top:-13px; width:24px; height:24px; border-radius:50%; background:var(--bg)}
.perf::before{left:-12px} .perf::after{right:-12px}
.label{font-family:'IBM Plex Mono',monospace; font-size:.74rem; font-weight:500; color:var(--soft); margin:0 0 8px; display:block}

textarea{
  width:100%; min-height:72px; resize:vertical; border:none; outline:none; padding:0; background:transparent;
  font-family:'Fredoka',sans-serif; font-weight:500; font-size:1.3rem; line-height:1.4; color:var(--ink);
}
textarea::placeholder{color:#B4B0D6}
.examples{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.chip{font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--ink); background:#F1EFFF; border:1.5px solid var(--ink); border-radius:999px; padding:3px 10px; cursor:pointer}
.chip:hover{background:var(--gold)}

#output{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1.12rem; line-height:2.1; min-height:34px; word-wrap:break-word}
.empty{color:#B4B0D6; font-family:'Fredoka',sans-serif; font-weight:500}
.syl.a{color:var(--ink)} .syl.b{color:var(--green-ink)}
[data-lang="en"] .syl.b{color:var(--violet)}
.dot{color:var(--gold); font-weight:700; padding:0 1px}
.approx{text-decoration:underline dotted var(--soft); text-underline-offset:5px}
.stats{font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--soft); margin:10px 0 0}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
button.copy{
  font-family:'Fredoka',sans-serif; font-weight:600; font-size:.95rem; padding:9px 14px; cursor:pointer;
  border:2px solid var(--ink); border-radius:10px; background:var(--gold); color:var(--ink); box-shadow:3px 3px 0 var(--ink);
}
button.copy.alt{background:#fff}
button.copy:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
button.copy.done{background:var(--green)}

details{margin-top:22px; color:#E4E0FF}
summary{font-family:'IBM Plex Mono',monospace; font-size:.82rem; cursor:pointer; color:#fff}
.how{font-size:.88rem; line-height:1.6; max-width:58ch; margin-top:10px}
.how p{margin:0 0 10px} .how strong{color:#fff}
footer{margin-top:34px; text-align:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:1.15rem; color:var(--green); -webkit-text-stroke:4px #fff; paint-order:stroke fill}

@media(max-width:480px){h1.title{font-size:2.7rem} .top,.stub{padding-left:16px; padding-right:16px}}
</style>
</head>
<body>
<main class="page" id="app" data-lang="es">
  <h1 class="title">Silabário</h1>
  <p class="tagline">hifenização automática · espanhol e inglês</p>

  <div class="tabs">
    <button class="tab active" data-lang="es">Español</button>
    <button class="tab" data-lang="en">English</button>
  </div>

  <section class="ticket">
    <div class="top">
      <label class="label" for="input">seu texto</label>
      <textarea id="input" rows="2" placeholder="Digite ou cole seu texto aqui..."></textarea>
      <div class="examples" id="examples"></div>
    </div>
    <div class="perf"></div>
    <div class="stub">
      <span class="label">sílabas</span>
      <div id="output"><span class="empty">As sílabas aparecerão aqui...</span></div>
      <p class="stats" id="stats"></p>
      <div class="toolbar">
        <button class="copy" id="copyHyphen">Copiar com hífen -</button>
        <button class="copy alt" id="copyDot">Copiar com ponto ·</button>
      </div>
    </div>
  </section>

  <details>
    <summary>como funciona / limitações</summary>
    <div class="how" id="how">
      <p>Baseia-se num dicionário interno para dividir as sílabas corretamente. Palavras não encontradas não serão divididas.</p>
    </div>
  </details>

  <footer>feito por @omnadesigner</footer>
</main>
